name: Reconstruir resultados DSATUR
on:
  push:
    paths:
      - '.github/workflows/reconstruir-resultados-dsatur.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r DSATUR/requirements.txt
      - name: Resolver y guardar los 30 polígonos
        working-directory: DSATUR
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          from pathlib import Path
          from reforestacion.config import perfil
          from reforestacion.datos import Datos, cargar_competencia
          from reforestacion.experimento import ejecutar_lote, guardar_ejecucion, guardar_monte_carlo_por_poligono
          root=Path.cwd()
          out=root/'resultados'
          datos=Datos(root)
          cfg=perfil('completo',poligonos='todos',escenarios=12)
          C=cargar_competencia(root/'config/competencia.json',datos.S)
          lote=ejecutar_lote(datos,cfg,C,salida_detalles=out,graficas=True)
          guardar_ejecucion(out,datos,cfg,C,lote,organizado=True)
          guardar_monte_carlo_por_poligono(out,lote)
          print(lote.estado.value_counts().to_string())
          assert len(lote)==360 and lote.estado.eq('ok').all(), 'No se completaron los 360 escenarios'
          for p in range(1,31):
              ruta=out/f'P{p}'
              assert all((ruta/n).is_file() for n in ('distribucion.csv','comparacion.csv','monte_carlo.csv','estadisticas_mc.csv'))
              assert len(list((ruta/'graficas').glob('*.png')))==4
          print('30 carpetas completas')
          for viejo in out.glob('P*/graficas/03_comparacion.svg'):
              viejo.unlink()
          PY
      - name: Guardar resultados en main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A DSATUR/resultados
          if ! git diff --cached --quiet; then
            git commit -m "Guardar resultados completos P1-P30 de DSATUR"
            git push
          fi
